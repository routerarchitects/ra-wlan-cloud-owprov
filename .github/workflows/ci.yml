name: CI

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  yaml-validation:
    name: Validate YAML Syntax
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Validation Dependencies
      run: python3 -m pip install --disable-pip-version-check PyYAML

    - name: Validate YAML Syntax Dynamically
      run: |
        files=$(find openapi -type f \( -name "*.yaml" -o -name "*.yml" \))
        if [ -z "$files" ]; then
          echo "ERROR: No YAML files (.yaml or .yml) found in openapi/ directory!"
          exit 1
        fi
        find openapi -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | \
          xargs -0 -r -n1 python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1], encoding="utf-8"))'
        echo "All discovered YAML files parsed successfully!"

  shell-script-check:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Check Shell Scripts Syntax
      run: |
        find . -type f \( -name "*.sh" -o -perm -111 \) \
          -not -path "*/.git/*" \
          -not -path "*/build/*" \
          -not -path "*/cmake-build/*" \
          -not -path "*/node_modules/*" \
          | while read -r file; do
              if [[ "$file" == *.sh ]] || head -n 1 "$file" | grep -qE '^#!.*/(ba)?sh'; then
                echo "Checking syntax: $file"
                bash -n "$file"
              fi
            done
        echo "All discovered shell scripts passed syntax check!"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t owprov:test .
