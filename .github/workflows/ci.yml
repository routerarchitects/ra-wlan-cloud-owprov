name: CI

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  openapi-validation:
    name: Validate OpenAPI Schemas
    runs-on: ubuntu-latest
    continue-on-error: true   # OpenAPI specs have known pre-existing issues; report but don't block CI
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Redocly CLI
      run: npm install -g @redocly/cli@2.41.1

    - name: Validate OpenAPI Specifications with Redocly
      run: |
        echo "Found OpenAPI files:"
        find openapi -type f \( -name '*.yaml' -o -name '*.yml' \) | sort

        # Lint each file individually so we get per-file output
        failed=0
        while IFS= read -r file; do
          echo "--- Linting: $file ---"
          redocly lint "$file" || failed=1
        done < <(find openapi -type f \( -name '*.yaml' -o -name '*.yml' \) | sort)

        if [ "$failed" -eq 1 ]; then
          echo "::warning::OpenAPI validation found issues (see above). These are pre-existing and tracked separately."
        fi

  shell-script-check:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Check Shell Scripts Syntax
      run: |
        set -euo pipefail

        while IFS= read -r -d '' file; do
          if [[ "$file" == *.sh ]] || head -n 1 "$file" | grep -qE '^#!.*/(ba)?sh([[:space:]]|$)'; then
            echo "Checking syntax: $file"
            bash -n "$file"
          fi
        done < <(
          find . -type f \( -name '*.sh' -o -perm -111 \) \
            -not -path '*/.git/*' \
            -not -path '*/build/*' \
            -not -path '*/cmake-build/*' \
            -not -path '*/node_modules/*' \
            -print0
        )

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: |
        docker build -t owprov:test .

    - name: Verify runtime shared-library dependencies
      run: |
        docker run --rm \
          --entrypoint /bin/bash \
          owprov:test \
          -c 'ldd /openwifi/owprov && ! ldd /openwifi/owprov | grep -q "not found"'

  multi-instance-tests:
    name: Multi-Instance Startup Lock Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owprov_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Build OWPROV Docker Image
        run: |
          docker build -t owprov:test .

      - name: Run Multi-Instance Startup Lock Tests
        run: |
          docker run --rm --network host \
            --entrypoint /bin/bash \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER=postgres \
            -e PGPASSWORD=postgres \
            -e PGDATABASE=owprov_test \
            -e OWPROV_BIN=/openwifi/owprov \
            -v ${{ github.workspace }}:/app \
            -w /app/tests/multi_instance_tests \
            owprov:test -lc '
              set -euxo pipefail
              apt-get update -qq
              apt-get install -y --no-install-recommends golang-go openssl
              go test -v ./...
            '


