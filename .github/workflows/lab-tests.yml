name: Lab & RBAC Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lab-tests:
    name: Run Lab Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── Go setup (for mock services + test runner) ───────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Build mock services ──────────────────────────────────────────────────
      - name: Build mock_owsec
        run: go build -o /tmp/mock_owsec .
        working-directory: ${{ github.workspace }}/tests/mock_services/mock_owsec

      - name: Build mock_fms
        run: go build -o /tmp/mock_fms .
        working-directory: ${{ github.workspace }}/tests/mock_services/mock_fms

      # ── Start Kafka (KRaft mode, no ZooKeeper) ───────────────────────────────
      - name: Start Kafka
        run: |
          set -euo pipefail

          docker run -d \
            --name kafka \
            --network host \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            apache/kafka:3.7.1

          echo "Waiting for Kafka to be ready..."

          for i in {1..30}; do
            if docker exec kafka /opt/kafka/bin/kafka-topics.sh \
              --bootstrap-server localhost:9092 \
              --list > /dev/null 2>&1; then
              echo "Kafka is ready!"
              exit 0
            fi

            echo "attempt $i/30..."
            sleep 2
          done

          echo "ERROR: Kafka did not start in time!"
          docker logs kafka | tail -100
          exit 1

      # ── Create Kafka topic ───────────────────────────────────────────────────
      - name: Create Kafka service_events topic
        run: |
          docker exec kafka /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --topic service_events \
            --partitions 1 --replication-factor 1 \
            --if-not-exists


      # ── Build owprov Docker image ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build owprov Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: owprov:test
          cache-from: type=gha
          cache-to: type=gha,mode=max


      # ── Build owprov Docker image (with layer cache) ──────────────────────────
      - name: Prepare owprov runtime data
        run: |
          set -euo pipefail

          mkdir -p /tmp/owprov-data/certs
          mkdir -p /tmp/owprov-data/data

          cat > /tmp/owprov-data/data/registry.json <<'EOF'
          {
            "deviceTypes": [
              "openwrt_generic",
              "edgecore_eap101",
              "edgecore_eap102",
              "edgecore_ecs4100",
              "indio_um305ac",
              "cig_wf188",
              "wlan_ap",
              "generic",
              "tplink_archer"
            ]
          }
          EOF

          # 1. Generate Test Root CA (with CA:TRUE extension)
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout /tmp/owprov-data/certs/ca-key.pem \
            -out /tmp/owprov-data/certs/restapi-ca.pem \
            -subj "/CN=Test-Root-CA"

          # 2. Generate Server Private Key and CSR
          openssl req -new -nodes -newkey rsa:2048 \
            -keyout /tmp/owprov-data/certs/restapi-key.pem \
            -out /tmp/owprov-data/certs/server.csr \
            -subj "/CN=localhost"

          # 3. Create SAN extension file
          cat > /tmp/owprov-data/certs/san.ext <<'EOF'
          authorityKeyIdentifier=keyid,issuer
          basicConstraints=CA:FALSE
          keyUsage = digitalSignature, nonRepudiation, keyEncipherment, dataEncipherment
          subjectAltName = @alt_names

          [alt_names]
          DNS.1 = localhost
          IP.1 = 127.0.0.1
          EOF

          # 4. Sign Server Cert using the Test Root CA
          openssl x509 -req -days 1 \
            -in /tmp/owprov-data/certs/server.csr \
            -CA /tmp/owprov-data/certs/restapi-ca.pem \
            -CAkey /tmp/owprov-data/certs/ca-key.pem \
            -CAcreateserial \
            -out /tmp/owprov-data/certs/restapi-cert.pem \
            -extfile /tmp/owprov-data/certs/san.ext

          chmod 644 /tmp/owprov-data/certs/ca-key.pem
          chmod 644 /tmp/owprov-data/certs/restapi-key.pem
          chmod 644 /tmp/owprov-data/certs/restapi-cert.pem
          chmod 644 /tmp/owprov-data/certs/restapi-ca.pem

          chmod 777 /tmp/owprov-data/data
          chmod 666 /tmp/owprov-data/data/registry.json

          echo "registry.json:"
          cat /tmp/owprov-data/data/registry.json


      # -- Diagnostic check --
      - name: Debug owprov image user and mounts
        run: |
          set -euo pipefail

          echo "Configured image user:"
          docker image inspect owprov:test \
            --format 'User={{.Config.User}}'

          echo "Files as seen from inside container:"
          docker run --rm \
            -v /tmp/owprov-data/certs:/owprov-data/certs:ro \
            -v /tmp/owprov-data/data:/owprov-data/data \
            owprov:test \
            sh -c '
              id
              echo "--- certs ---"
              ls -la /owprov-data/certs
              echo "--- data ---"
              ls -la /owprov-data/data
              echo "--- key readability ---"
              test -r /owprov-data/certs/restapi-key.pem &&
                echo "KEY READABLE" ||
                { echo "KEY NOT READABLE"; exit 1; }
            '

      # ── Start mock services ───────────────────────────────────────────────────
      - name: Start mock_owsec and mock_fms
        run: |
          set -e
          PORT=16001 CERT_FILE=/tmp/owprov-data/certs/restapi-cert.pem KEY_FILE=/tmp/owprov-data/certs/restapi-key.pem /tmp/mock_owsec &
          PORT=16004 CERT_FILE=/tmp/owprov-data/certs/restapi-cert.pem KEY_FILE=/tmp/owprov-data/certs/restapi-key.pem /tmp/mock_fms &

          echo "Waiting for mock_owsec (port 16001)..."
          for i in {1..20}; do
            if curl -k -s --fail --max-time 2 https://localhost:16001/api/v1/validateToken > /dev/null 2>&1; then
              echo "mock_owsec is UP!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "ERROR: mock_owsec did not start!"
              exit 1
            fi
            sleep 1
          done

          echo "Waiting for mock_fms (port 16004)..."
          for i in {1..20}; do
            if curl -k -s --fail --max-time 2 https://localhost:16004/api/v1/firmwares > /dev/null 2>&1; then
              echo "mock_fms is UP!"
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "ERROR: mock_fms did not start!"
              exit 1
            fi
            sleep 1
          done

      # ── Start PostgreSQL container ───────────────────────────────────────────
      - name: Start PostgreSQL container
        run: |
          set -euo pipefail

          docker run -d \
            --name postgres \
            --network host \
            -e POSTGRES_USER=owprov \
            -e POSTGRES_PASSWORD=owprov \
            -e POSTGRES_DB=owprov \
            postgres:15

          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec postgres pg_isready -U owprov > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "ERROR: PostgreSQL did not start in time!"
              docker logs postgres
              exit 1
            fi
            sleep 1
          done

      # ── Seed legacy schema & dirty data for brownfield migration test ────────
      - name: Seed legacy schema and dirty data for migration verification
        run: |
          set -euo pipefail
          echo "Seeding legacy (v1) schema and corrupt/orphaned data into PostgreSQL..."

          docker exec -i postgres psql -U owprov -d owprov << 'EOF'
          -- 1. Create policies table
          CREATE TABLE IF NOT EXISTS policies (
              id VARCHAR(64) PRIMARY KEY,
              name TEXT,
              description TEXT,
              notes TEXT,
              created BIGINT,
              modified BIGINT,
              entries TEXT,
              inUse TEXT,
              tags TEXT,
              entity TEXT,
              venue TEXT
          );

          -- 2. Insert valid reference policy
          INSERT INTO policies (id, name, description, notes, created, modified, entries, inUse, tags, entity, venue)
          VALUES ('mig-valid-policy-001', 'Migration Valid Policy', 'Valid policy for migration test', '[]', 1600000000, 1600000000, '[]', '[]', '[]', '', '');

          -- 3. Create legacy roles table (v1: missing entity & venue columns, nullable managementPolicy, no FK)
          CREATE TABLE roles (
              id VARCHAR(64) PRIMARY KEY,
              name TEXT,
              description TEXT,
              notes TEXT,
              created BIGINT,
              modified BIGINT,
              managementPolicy VARCHAR(64),
              users TEXT,
              inUse TEXT,
              tags TEXT
          );

          -- 4. Seed dirty and valid roles
          -- Role 1: Corrupt - NULL managementPolicy
          INSERT INTO roles (id, name, description, notes, created, modified, managementPolicy, users, inUse, tags)
          VALUES ('mig-role-null-001', 'Role With NULL Policy', 'Should be auto-purged', '[]', 1600000000, 1600000000, NULL, '[]', '[]', '[]');

          -- Role 2: Corrupt - Empty string managementPolicy
          INSERT INTO roles (id, name, description, notes, created, modified, managementPolicy, users, inUse, tags)
          VALUES ('mig-role-empty-002', 'Role With Empty Policy', 'Should be auto-purged', '[]', 1600000000, 1600000000, '', '[]', '[]', '[]');

          -- Role 3: Corrupt - Orphaned managementPolicy UUID (not present in policies)
          INSERT INTO roles (id, name, description, notes, created, modified, managementPolicy, users, inUse, tags)
          VALUES ('mig-role-orphan-003', 'Role With Orphaned Policy', 'Should be auto-purged', '[]', 1600000000, 1600000000, 'non-existent-policy-999', '[]', '[]', '[]');

          -- Role 4: Valid - References existing policy
          INSERT INTO roles (id, name, description, notes, created, modified, managementPolicy, users, inUse, tags)
          VALUES ('mig-role-valid-004', 'Role With Valid Policy', 'Should survive migration', '[]', 1600000000, 1600000000, 'mig-valid-policy-001', '[]', '[]', '[]');
          EOF

          echo "Legacy schema and dirty test data successfully seeded."

      # ── Start owprov container ────────────────────────────────────────────────
      - name: Start owprov container
        run: |
          set -euo pipefail

          docker run -d \
            --name owprov \
            --network host \
            -v /tmp/owprov-data/certs:/owprov-data/certs:ro \
            -v /tmp/owprov-data/certs/restapi-ca.pem:/usr/local/share/ca-certificates/restapi-ca-selfsigned.crt:ro \
            -v /tmp/owprov-data/data:/owprov-data/data \
            -e SELFSIGNED_CERTS=true \
            -e TEMPLATE_CONFIG=true \
            -e KAFKA_ENABLE=true \
            -e KAFKA_BROKERLIST=localhost:9092 \
            -e STORAGE_TYPE=postgresql \
            -e STORAGE_TYPE_POSTGRESQL_HOST=localhost \
            -e STORAGE_TYPE_POSTGRESQL_PORT=5432 \
            -e STORAGE_TYPE_POSTGRESQL_USERNAME=owprov \
            -e STORAGE_TYPE_POSTGRESQL_PASSWORD=owprov \
            -e STORAGE_TYPE_POSTGRESQL_DATABASE=owprov \
            -e RESTAPI_HOST_PORT=16005 \
            -e INTERNAL_RESTAPI_HOST_PORT=17005 \
            owprov:test

          echo "Waiting for owprov to start on port 16005..."

          SUCCESS=0
          for i in {1..40}; do
            if curl -k -s --max-time 3 \
              "https://localhost:16005/api/v1/system?command=info" \
              > /dev/null 2>&1; then
              echo "owprov HTTPS endpoint is reachable!"
              SUCCESS=1
              break
            fi

            if ! docker inspect -f '{{.State.Running}}' owprov 2>/dev/null | grep -q true; then
              echo "ERROR: owprov container exited!"
              docker logs owprov
              exit 1
            fi

            echo "attempt $i/40..."
            sleep 3
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "ERROR: owprov did not start in time!"
            docker logs owprov
            exit 1
          fi

      # ── Verify brownfield schema migration and data integrity ────────────────
      - name: Verify schema migration and data integrity
        run: |
          set -euo pipefail
          echo "=== Verifying Brownfield Schema Migration & Data Integrity ==="

          # 1. Verify corrupt roles were purged during migration
          PURGED_COUNT=$(docker exec postgres psql -U owprov -d owprov -t -A -c \
            "SELECT COUNT(*) FROM roles WHERE id IN ('mig-role-null-001', 'mig-role-empty-002', 'mig-role-orphan-003');")
          echo "Purged corrupt roles remaining: ${PURGED_COUNT}"
          if [ "${PURGED_COUNT}" -ne 0 ]; then
            echo "ERROR: Corrupt roles were not purged during migration!"
            docker exec postgres psql -U owprov -d owprov -c "SELECT id, name, managementPolicy FROM roles;"
            exit 1
          fi

          # 2. Verify valid role survived migration
          SURVIVED_COUNT=$(docker exec postgres psql -U owprov -d owprov -t -A -c \
            "SELECT COUNT(*) FROM roles WHERE id = 'mig-role-valid-004' AND managementPolicy = 'mig-valid-policy-001';")
          echo "Valid role survived count: ${SURVIVED_COUNT}"
          if [ "${SURVIVED_COUNT}" -ne 1 ]; then
            echo "ERROR: Valid role was unexpectedly purged or modified during migration!"
            exit 1
          fi

          # 3. Verify columns 'entity' and 'venue' were added (v1 -> v2 migration)
          COL_COUNT=$(docker exec postgres psql -U owprov -d owprov -t -A -c \
            "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema = current_schema() AND lower(table_name) = 'roles' AND lower(column_name) IN ('entity', 'venue');")
          echo "Added columns count (entity, venue): ${COL_COUNT}"
          if [ "${COL_COUNT}" -ne 2 ]; then
            echo "ERROR: Columns 'entity' and 'venue' were not added to roles table!"
            exit 1
          fi

          # 4. Verify 'managementPolicy' column is NOT NULL
          IS_NULLABLE=$(docker exec postgres psql -U owprov -d owprov -t -A -c \
            "SELECT is_nullable FROM information_schema.columns WHERE table_schema = current_schema() AND lower(table_name) = 'roles' AND lower(column_name) = 'managementpolicy';")
          echo "managementPolicy is_nullable: ${IS_NULLABLE}"
          if [ "${IS_NULLABLE}" != "NO" ]; then
            echo "ERROR: managementPolicy is not NOT NULL (got ${IS_NULLABLE})!"
            exit 1
          fi

          # 5. Verify fk_roles_management_policy constraint exists in catalog
          FK_COUNT=$(docker exec postgres psql -U owprov -d owprov -t -A -c \
            "SELECT COUNT(*) FROM information_schema.table_constraints WHERE table_schema = current_schema() AND lower(table_name) = 'roles' AND lower(constraint_name) = 'fk_roles_management_policy';")
          echo "FK constraint count: ${FK_COUNT}"
          if [ "${FK_COUNT}" -ne 1 ]; then
            echo "ERROR: fk_roles_management_policy constraint missing from catalog!"
            exit 1
          fi

          # 6. Verify FK enforcement: deleting referenced policy must fail
          echo "Testing foreign key enforcement on DELETE..."
          set +e
          FK_OUTPUT=$(docker exec postgres psql -U owprov -d owprov -c \
            "DELETE FROM policies WHERE id = 'mig-valid-policy-001';" 2>&1)
          FK_STATUS=$?
          set -e

          if [ $FK_STATUS -ne 0 ] && echo "${FK_OUTPUT}" | grep -q "violates foreign key constraint"; then
            echo "SUCCESS: Foreign key actively prevented policy deletion: ${FK_OUTPUT}"
          else
            echo "ERROR: Foreign key did not prevent referenced policy deletion! Status: ${FK_STATUS}, Output: ${FK_OUTPUT}"
            exit 1
          fi

          # 7. Clean up migration test fixtures and verify unblocked policy deletion
          docker exec postgres psql -U owprov -d owprov -c \
            "DELETE FROM roles WHERE id = 'mig-role-valid-004';"
          docker exec postgres psql -U owprov -d owprov -c \
            "DELETE FROM policies WHERE id = 'mig-valid-policy-001';"
          echo "Migration test fixtures cleaned up successfully."

          # 8. Test restart idempotency: restart owprov and ensure clean boot
          echo "Testing daemon restart idempotency..."
          docker restart owprov
          sleep 2
          for i in {1..40}; do
            if curl -k -s --max-time 3 "https://localhost:16005/api/v1/system?command=info" > /dev/null 2>&1; then
              echo "owprov successfully restarted and healthy after schema upgrade!"
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' owprov 2>/dev/null | grep -q true; then
              echo "ERROR: owprov container crashed on restart!"
              docker logs owprov
              exit 1
            fi
            if [ "$i" -eq 40 ]; then
              echo "ERROR: owprov did not restart in time!"
              docker logs owprov
              exit 1
            fi
            sleep 2
          done

          echo "=== All Brownfield Schema Migration Assertions Passed! ==="

      # ── Publish Kafka join events ────────────────────────────────────────────
      - name: Publish owsec + owfms Kafka join events
        run: |
          set -euo pipefail

          echo '{"event":"join","id":16001,"type":"owsec","publicEndPoint":"https://localhost:16001","privateEndPoint":"https://localhost:16001","key":"testkey","version":"2.1.0"}' | \
            docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic service_events

          echo '{"event":"join","id":16004,"type":"owfms","publicEndPoint":"https://localhost:16004","privateEndPoint":"https://localhost:16004","key":"testkey","version":"2.1.0"}' | \
            docker exec -i kafka /opt/kafka/bin/kafka-console-producer.sh \
            --bootstrap-server localhost:9092 \
            --topic service_events

          echo "Waiting for owprov to consume service join events..."
          sleep 10

          echo "Checking owprov logs for Kafka registration problems..."
          docker logs owprov 2>&1 | tail -50

      # ── Run combined test suite ───────────────────────────────────────────────
      - name: Execute Combined Lab Test Suite (Root + Admin)
        run: go run main.go
        working-directory: ${{ github.workspace }}/tests/lab_tests

      # ── Run RBAC immutability and policy protection tests ─────────────────────
      - name: Execute RBAC Immutability and Policy Protection Tests
        run: |
          go test -v . -run "TestManagementRoleImmutability|TestManagementRoleCreationPolicyValidation|TestManagementPolicyDeletionProtection"
        working-directory: ${{ github.workspace }}/tests/rbac_tests
        env:
          OWPROV_URL: "https://localhost:16005/api/v1"
          TOKEN_ROOT: "Bearer root-test-token"
          TOKEN_NO_ACCESS: "Bearer user-read-only-token"

      # ── Upload results ────────────────────────────────────────────────────────
      - name: Upload Test Result Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-test-results
          path: tests/lab_tests/rbac_actual_results.csv

      # ── Debug on failure ──────────────────────────────────────────────────────
      - name: Dump owprov logs on failure
        if: failure()
        run: |
          docker logs owprov 2>&1 | tail -100
          docker logs postgres 2>&1 | tail -50 || true
